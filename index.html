/* Layout: one narrow mobile column, tabs fixed at the bottom; numbers in mono, zones carried by color chips */
:root{

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){

  --accent:#78A8EA; --accent-ink:#0B1730; --accent-soft:#1C2B42;

*{box-sizing:border-box}

.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 96px;display:grid;gap:14px}

.bar{height:5px;border-radius:3px;background:var(--sunk);overflow:hidden}

.tl{display:grid;gap:0}

.item .nm{min-width:0;font-size:14px}
.item .nm small{display:block;color:var(--muted);font-size:12px}
.item input{padding:7px 8px;text-align:right;font-family:var(--f-num)}
.item button{padding:6px;border:0;background:transparent;color:var(--muted);font-size:18px;line-height:1}
.results{display:grid;gap:4px;max-height:240px;overflow:auto}
.res{display:flex;justify-content:space-between;gap:10px;text-align:left;font-weight:500;border-color:transparent;background:var(--sunk)}
.res span{color:var(--muted);font-weight:400;font-size:12px;white-space:nowrap}
.totals{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.totals b{color:var(--ink);font-family:var(--f-num);font-weight:600}
.chw{overflow-x:auto}

svg.ch .dot{stroke:var(--surface);stroke-width:1.5}
svg.ch .d-ok{fill:var(--ok)} svg.ch .d-bas{fill:var(--low)} svg.ch .d-hypo{fill:var(--hypo)} svg.ch .d-haut,svg.ch .d-tres{fill:var(--high)} svg.ch .d-acc{fill:var(--accent)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:6px 4px;border-top:1px solid var(--line);vertical-align:top}
th{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase;border-top:0}
td.n{font-family:var(--f-num);text-align:right;white-space:nowrap} th.n{text-align:right}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{display:grid;gap:2px}
.stat .v{font-family:var(--f-num);font-size:20px;font-weight:600}
.stat .k{font-size:12px;color:var(--muted)}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));z-index:5}

.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current="page"]{color:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:14px;z-index:9;max-width:calc(100% - 32px)}
.linkinfo{font-size:13px;color:var(--muted)}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
.adv{display:grid;gap:8px}
.disc{font-size:12px;color:var(--muted)}

.pd{font-size:12px;font-family:var(--f-num)}

<div class="wrap">
  <header class="top">
    <div class="brand"><h1>Carnet Glycémie</h1><small id="storeState">chargement…</small></div>
  </header>

  <!-- JOUR -->
  <section id="tab-jour" class="wrap-sec" style="display:grid;gap:14px">
    <div id="jour-hero"></div>
    <form class="card" id="qa" autocomplete="off">
      <div class="row" style="justify-content:space-between"><h2>Nouvelle glycémie</h2></div>
      <div class="row">
        <label class="f grow">Valeur (g/L)<input id="qa-v" inputmode="decimal" placeholder="0,95"></label>
        <label class="f grow">Heure<input id="qa-t" type="datetime-local"></label>
      </div>
      <label class="f">Moment
        <select id="qa-c">
          <option value="jeun">À jeun (réveil)</option>
          <option value="avant">Avant repas</option>
          <option value="apres">Après repas</option>
          <option value="coucher">Avant coucher</option>
          <option value="nuit">Nuit</option>
          <option value="autre">Autre</option>
        </select>
      </label>
      <div class="linkinfo" id="qa-link"></div>
      <button class="primary" type="submit">Enregistrer la mesure</button>
    </form>
    <div id="jour-dyn" style="display:grid;gap:14px"></div>
  </section>

  <!-- REPAS -->
  <section id="tab-repas" hidden style="display:grid;gap:14px">
    <div class="card" id="r-quick" hidden></div>
    <div class="card">
      <div class="row" style="justify-content:space-between"><h2 id="r-title">Nouveau repas</h2><button class="ghost" type="button" id="r-reset">Vider</button></div>
      <div class="seg" id="r-type" role="group" aria-label="Type de repas">
        <button type="button" data-v="pdej">Petit-déj.</button><button type="button" data-v="dej">Déjeuner</button><button type="button" data-v="col">Collation</button><button type="button" data-v="din">Dîner</button>
      </div>
      <div class="row">
        <label class="f grow">Heure du repas<input id="r-ts" type="datetime-local"></label>
        <label class="f grow">Nom (facultatif)<input id="r-label" placeholder="Tajine kefta"></label>
      </div>
    </div>

    <div class="card">
      <div class="row" style="justify-content:space-between"><h2>Ce que je mange</h2></div>
      <div class="seg" id="r-mode" role="group" aria-label="Mode de saisie">
        <button type="button" data-v="liste">Liste d'aliments</button><button type="button" data-v="texte">Texte libre</button>
      </div>
      <div id="m-liste" style="display:grid;gap:8px">
        <input id="r-search" placeholder="Chercher : pain d'orge, kefta, lben…" autocomplete="off">
        <div class="results" id="r-results"></div>
        <details id="myfoods" hidden><summary id="myfoods-s">Mes aliments</summary><div class="mf" id="myfoods-l"></div></details>
      </div>
      <div id="m-texte" hidden style="display:grid;gap:8px">
        <textarea id="r-text" placeholder="Ex : tajine kefta avec oignon, 150 g pain d'orge, coca zero"></textarea>
        <div class="row">
          <button type="button" id="r-parse">Estimer</button>
          
          <span class="small muted" id="r-ai-st"></span>
        </div>
        <div class="small muted" id="r-miss"></div>
      </div>
      <button type="button" class="ghost" id="nf-open" style="justify-self:start">+ Aliment absent de la liste</button>
      <div class="nf" id="nf" hidden>
        <h3>Nouvel aliment</h3>
        <label class="f">Nom<input id="nf-name" placeholder="Ex : msemen farci maison" autocomplete="off"></label>
        <div class="row">
          <label class="f grow">Quantité mangée (g)<input id="nf-g" inputmode="decimal" placeholder="150"></label>
          <label class="f grow">Portion (facultatif)<input id="nf-unit" placeholder="pièce, bol, tranche"></label>
        </div>
        <div class="f"><span>Les valeurs que j'entre sont pour</span>
          <div class="seg" id="nf-basis" role="group" aria-label="Base des valeurs"><button type="button" data-v="qty" aria-pressed="true">La quantité mangée</button><button type="button" data-v="100" aria-pressed="false">100 g (étiquette)</button></div>
        </div>
        <div class="nf-grid">
          <label class="f">Calories (kcal)<input id="nf-kcal" inputmode="decimal" placeholder="auto"></label>
          <label class="f">Glucides (g)<input id="nf-c" inputmode="decimal" placeholder="0"></label>
          <label class="f">Protéines (g)<input id="nf-p" inputmode="decimal" placeholder="0"></label>
          <label class="f">Lipides (g)<input id="nf-f" inputmode="decimal" placeholder="0"></label>
          <label class="f">Fibres (g)<input id="nf-fi" inputmode="decimal" placeholder="0"></label>
        </div>
        <div class="row">
          <label class="f grow">Index glycémique (0-100)<input id="nf-gi" inputmode="numeric" placeholder="si connu"></label>
          <label class="f grow">ou charge glycémique<input id="nf-cg" inputmode="decimal" placeholder="si connue"></label>
        </div>
        <div class="chips" id="nf-giq"><span class="small muted" style="align-self:center">IG rapide :</span><button type="button" data-gi="0">Sans sucre 0</button><button type="button" data-gi="35">Bas 35</button><button type="button" data-gi="55">Moyen 55</button><button type="button" data-gi="70">Élevé 70</button></div>
        <div class="nf-calc" id="nf-calc"></div>
        <label class="row" style="gap:10px;font-size:14px;flex-wrap:nowrap"><input type="checkbox" id="nf-keep" checked style="width:20px;height:20px;flex:none"> Garder dans « Mes aliments » pour la prochaine fois</label>
        <div class="row"><button type="button" class="primary" id="nf-add">Ajouter au repas</button><button type="button" id="nf-cancel">Annuler</button></div>
      </div>
      <div class="items" id="r-items"></div>
      <div class="totals" id="r-totals"></div>
    </div>

    <div class="card">
      <h2>Contexte</h2>
      <label class="row" style="gap:10px;font-size:15px"><input type="checkbox" id="r-diaf" style="width:20px;height:20px"> Diaformine prise avec ce repas</label>
      <div class="row">
        <label class="f grow">Activité après le repas
          <select id="r-act"><option value="aucune">Aucune</option><option value="soleus">Soleus</option><option value="marche">Marche</option></select>
        </label>
        <label class="f grow">Durée (min)<input id="r-actmin" inputmode="numeric" placeholder="15"></label>
      </div>
      <label class="f">Glycémie avant le repas (g/L)<input id="r-pre" inputmode="decimal" placeholder="0,90"></label>
      <div class="linkinfo" id="r-prehint"></div>
    </div>

    <div class="card" id="r-forecast"></div>

    <div class="row">
      <button class="primary grow" type="button" id="r-save">Enregistrer le repas</button>
    </div>
  </section>

  <!-- ANALYSE -->
  <section id="tab-modele" hidden style="display:grid;gap:14px"><div id="modele-dyn" style="display:grid;gap:14px"></div></section>

  <!-- POIDS -->
  <section id="tab-poids" hidden style="display:grid;gap:14px">
    <form class="card" id="wf" autocomplete="off">
      <h2>Nouvelle pesée</h2>
      <div class="row">
        <label class="f grow">Poids (kg)<input id="w-kg" inputmode="decimal" placeholder="103,3"></label>
        <label class="f grow">Date<input id="w-d" type="date"></label>
      </div>
      <p class="small muted" style="margin:0">Pesez-vous le matin à jeun, après les toilettes, sur la même balance.</p>
      <button class="primary" type="submit">Enregistrer</button>
    </form>
    <div id="poids-dyn" style="display:grid;gap:14px"></div>
  </section>
</div>

<nav class="tabs" aria-label="Sections"><div>
  <button type="button" data-tab="jour" aria-current="page"><svg viewBox="0 0 24 24"><path d="M12 3c3 4 6 7.5 6 11a6 6 0 0 1-12 0c0-3.5 3-7 6-11z"/></svg>Jour</button>
  <button type="button" data-tab="repas"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v8M8 12h8"/></svg>Repas</button>
  <button type="button" data-tab="modele"><svg viewBox="0 0 24 24"><path d="M3 18c3 0 4-9 7-9s3 6 5 6 3-4 6-4"/></svg>Analyse</button>
  <button type="button" data-tab="poids"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M9 10a3 3 0 0 1 6 0M12 10l1.5-2"/></svg>Poids</button>
</div></nav>
<section id="report" hidden></section>
<div class="toast" id="toast" hidden></div>

const reEsc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");

const NUMW={un:1,une:1,deux:2,trois:3,quatre:4,cinq:5,six:6,sept:7,huit:8,neuf:9,dix:10,demi:0.5,demie:0.5,moitie:0.5,quart:0.25};
function parseText(txt){
  const segs=norm(txt).split(/,|;|\+|\n|\bet\b|\bavec\b|\bpuis\b/).map(s=>s.trim()).filter(Boolean);
  const items=[],miss=[];
  for(let s of segs){
    let work=" "+s+" ";const found=[];
    syncCustom();for(const x of ALL_ALIASES){
      const re=new RegExp("(^|[^a-z0-9])"+reEsc(x.a)+"(s|x)?(?=[^a-z]|$)");
      const m=work.match(re);
      if(m){if(!found.some(o=>o.f.id===x.f.id))found.push({f:x.f,pos:m.index});work=work.replace(re,m[1]+" ".repeat(m[0].length-m[1].length))}
    }
    if(!found.length){miss.push(s);continue}
    found.sort((a,b)=>a.pos-b.pos);
    let grams=null,q=1;
    const mg=s.match(/(\d+(?:[.,]\d+)?)\s*(g|gr|gramme|grammes|ml)\b/);
    const mf=s.match(/(\d+)\s*\/\s*(\d+)/);
    const mn=s.match(/(\d+(?:[.,]\d+)?)/);
    if(mg)grams=num(mg[1]);

    else if(mf)q=num(mf[1])/num(mf[2]);
    else if(mn)q=num(mn[1]);
    else{for(const w of Object.keys(NUMW)){if(new RegExp("\\b"+w+"\\b").test(s)){q=NUMW[w];break}}}
    found.forEach((o,i)=>{const g=i===0?(grams!=null?grams:q*o.f.ug):o.f.ug;items.push(mkItem(o.f,g))});
  }
  return {items,miss};
}

/* ---------- Modèle ---------- */

  }

}
function postsFor(meal){return readings().filter(r=>r.mealId===meal.id&&r.rel==="post").map(r=>({r,m:(T(r.ts)-T(meal.ts))/60000}))}
function solve(A,b){const n=b.length;const M=A.map((row,i)=>[...row,b[i]]);for(let c=0;c<n;c++){let p=c;for(let r=c+1;r<n;r++)if(Math.abs(M[r][c])>Math.abs(M[p][c]))p=r;[M[c],M[p]]=[M[p],M[c]];const v=M[c][c]||1e-9;for(let r=0;r<n;r++){if(r===c)continue;const k=M[r][c]/v;for(let j=c;j<=n;j++)M[r][j]-=k*M[c][j]}}return M.map((row,i)=>row[n]/(row[i]||1e-9))}

  if(modelCache)return modelCache;

    const pre=preFor(meal);if(!pre)continue;

function curveStats(pts){
  let pk=pts[0],nd=null;for(const p of pts){if(p[1]>pk[1])pk=p;if(p[0]>=90&&(!nd||p[1]<nd[1]))nd=p}
  const at=m=>pts.find(p=>p[0]===m)[1];
  return {peak:pk[1],peakM:pk[0],nadir:nd[1],nadirM:nd[0],v2:at(120),v4:at(240)};
}

/* ---------- Graphique ---------- */
function chart(o){
  const w=o.w||340,h=o.h||190,L=32,R=8,Tp=8,B=20,W=w-L-R,H=h-Tp-B;
  const X=x=>L+(x-o.x0)/(o.x1-o.x0)*W,Y=y=>Tp+(1-(clamp(y,o.y0,o.y1)-o.y0)/(o.y1-o.y0))*H;
  let s=`<svg viewBox="0 0 ${w} ${h}" class="ch" role="img" aria-label="${esc(o.label||"Graphique")}">`;
  if(o.zones){
    s+=`<rect class="zb-ok" x="${L}" y="${Y(1.40)}" width="${W}" height="${Y(0.70)-Y(1.40)}"/>`;
    s+=`<rect class="zb-hypo" x="${L}" y="${Y(0.70)}" width="${W}" height="${Y(o.y0)-Y(0.70)}"/>`;
    if(o.y1>1.80)s+=`<rect class="zb-high" x="${L}" y="${Y(o.y1)}" width="${W}" height="${Y(1.80)-Y(o.y1)}"/>`;
    s+=`<line class="thr thr-hypo" x1="${L}" x2="${L+W}" y1="${Y(0.70)}" y2="${Y(0.70)}"/><line class="thr thr-high" x1="${L}" x2="${L+W}" y1="${Y(1.40)}" y2="${Y(1.40)}"/>`;
  }
  for(const t of o.yt){s+=`<line class="grid" x1="${L}" x2="${L+W}" y1="${Y(t)}" y2="${Y(t)}" opacity=".5"/><text x="${L-5}" y="${Y(t)+3}" text-anchor="end">${o.yf?o.yf(t):fd(t,1)}</text>`}
  for(const t of o.xt){s+=`<text x="${X(t.v)}" y="${h-5}" text-anchor="middle">${esc(t.l)}</text>`}
  for(const se of o.series){
    if(!se.pts.length)continue;
    if(se.type==="band"){const up=se.pts.map(p=>`${X(p[0])},${Y(p[2])}`),lo=se.pts.slice().reverse().map(p=>`${X(p[0])},${Y(p[1])}`);s+=`<polygon class="band" points="${up.concat(lo).join(" ")}"/>`}
    else if(se.type==="line"||se.type==="line2"){s+=`<path class="${se.type==="line"?"ln":"ln2"}" d="${se.pts.map((p,i)=>(i?"L":"M")+X(p[0]).toFixed(1)+" "+Y(p[1]).toFixed(1)).join(" ")}"/>`}
    else if(se.type==="dots"){for(const p of se.pts)s+=`<circle class="dot ${se.cls?se.cls:"d-"+zone(p[1])}" cx="${X(p[0]).toFixed(1)}" cy="${Y(p[1]).toFixed(1)}" r="${se.r||4}"/>`}
  }
  return s+"</svg>";
}

function nfRead(){
  const g=num($("#nf-g").value);const v=id=>{const x=num($("#"+id).value);return isFinite(x)&&x>=0?x:null};
  const raw={kcal:v("nf-kcal"),c:v("nf-c"),p:v("nf-p"),f:v("nf-f"),fi:v("nf-fi")};
  const k=nfBasis==="qty"?(g>0?100/g:null):1;
  const per=k==null?null:{c:(raw.c||0)*k,p:(raw.p||0)*k,f:(raw.f||0)*k,fi:(raw.fi||0)*k};
  let kcalAuto=false;if(per){if(raw.kcal!=null)per.kcal=raw.kcal*k;else{per.kcal=4*per.c+4*per.p+9*per.f;kcalAuto=true}}
  let gi=v("nf-gi"),giSrc="saisi";const cg=v("nf-cg");
  if(gi!=null)gi=clamp(gi,0,100);
  else if(cg!=null&&per&&g>0&&per.c*g/100>0){gi=clamp(cg*100/(per.c*g/100),0,100);giSrc="calculé depuis la charge"}
  else if(per){gi=per.c>0?55:0;giSrc=per.c>0?"estimé (moyen)":"sans glucides"}
  return {name:$("#nf-name").value.trim(),g,unit:$("#nf-unit").value.trim(),per,gi,giSrc,kcalAuto};
}

function predAt(meal,min){
  const c=meal&&meal.pred&&meal.pred.c;if(!c||!c.length||!(min>=0))return null;
  const x=min/10;if(x>c.length-1)return null;const i=Math.floor(x),f=x-i;
  return i+1<c.length?c[i]*(1-f)+c[i+1]*f:c[i];
}
function predPairs(){
  const out=[];for(const r of readings()){if(r.rel!=="post"||!r.mealId)continue;const m=ST.meals.get(r.mealId);if(!m||!m.pred)continue;
    const min=(T(r.ts)-T(m.ts))/60000;if(min<30||min>360)continue;const p=predAt(m,min);if(p!=null)out.push({r,m,p,err:r.v-p})}
  return out.sort((a,b)=>T(a.r.ts)-T(b.r.ts));
}

function periods(){

  return [{k:"30j",l:"30 derniers jours"},...[...ms].sort().reverse().map(k=>{const [y,m]=k.split("-");return {k,l:`${["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"][+m-1]} ${y}`}})];
}
function rangeOf(k){

  const [y,m]=k.split("-").map(Number);const a=`${k}-01T00:00`;const nx=m===12?`${y+1}-01`:`${y}-${pad(m+1)}`;const p=periods().find(x=>x.k===k);
  return {a,b:`${nx}-01T00:00`,l:p?p.l:k};
}
function openReport(k){
  const R0=rangeOf(k),inR=ts=>ts>=R0.a&&ts<R0.b;
  const rs=readings().filter(r=>inR(r.ts)),ms=meals().filter(m=>inR(m.ts));
  let h=`<div class="row noprint" style="justify-content:space-between"><button type="button" class="ghost" id="rep-close">‹ Retour</button><button type="button" class="primary" id="rep-print">Enregistrer en PDF</button></div>`;
  h+=`<p class="small muted noprint" style="margin:0">Dans la fenêtre qui s'ouvre, choisissez « Enregistrer au format PDF » comme imprimante, puis partagez le PDF par WhatsApp.</p>`;
  h+=`<div class="rep-head"><div class="eyebrow">Rapport de suivi glycémique</div><h1>Jaouad Smily</h1><div class="muted">Période : ${esc(R0.l)} · édité le ${dayLabel(dayOf(nowISO()))} ${nowISO().slice(0,4)}</div><div class="small">Traitement en cours : Diaformine 850 mg midi et soir, Liptorva 10 mg le soir. Diamicron arrêté le 1er juin 2026.</div></div>`;
  if(!rs.length){h+=`<div class="card"><p class="empty">Aucune glycémie enregistrée sur cette période.</p></div>`}
  else{
    const mean=rs.reduce((s,r)=>s+r.v,0)/rs.length,j=rs.filter(r=>r.ctx==="jeun"),inr=rs.filter(r=>r.v>=0.70&&r.v<=1.40).length,hi=rs.filter(r=>r.v>1.80).length,hy=rs.filter(r=>r.v<0.70);
    const gmi=3.31+0.02392*mean*100;
    h+=`<div class="card"><h2>Résumé</h2><div class="stats">
      <div class="stat"><span class="v">${rs.length}</span><span class="k">glycémies capillaires</span></div>
      <div class="stat"><span class="v">${fv(mean)}</span><span class="k">moyenne (g/L)</span></div>
      <div class="stat"><span class="v">${j.length?fv(j.reduce((s,r)=>s+r.v,0)/j.length):"–"}</span><span class="k">moyenne à jeun (${j.length})</span></div>
      <div class="stat"><span class="v">${Math.round(inr/rs.length*100)} %</span><span class="k">entre 0,70 et 1,40</span></div>
      <div class="stat"><span class="v ${hy.length?"z-hypo":""}">${hy.length}</span><span class="k">hypoglycémies &lt; 0,70</span></div>
      <div class="stat"><span class="v">${hi}</span><span class="k">valeurs &gt; 1,80</span></div>
      <div class="stat"><span class="v">${rs.length>=20?fd(gmi,1)+" %":"–"}</span><span class="k">HbA1c estimée (GMI)</span></div></div>
      <p class="disc" style="margin:0">L'HbA1c estimée (formule GMI, à partir de la glycémie moyenne) n'est qu'un indicateur : elle repose sur des mesures ponctuelles, souvent après les repas, et ne remplace pas un dosage au laboratoire.${rs.length<20?" Moins de 20 mesures : estimation non calculée.":""}</p></div>`;

function effectRows(){
  const base={ts:"2026-01-01T13:00",items:[mkItem(FBY.poulet,150),mkItem(FBY.salade,200)],diaf:true,act:{type:"aucune",min:0}};
  const st=(m,f=0)=>curveStats(curve(m,0.95,f));
  const b0=st(base);
  const wb={...base,items:base.items.concat([mkItem(FBY.pain_blanc,100)])},wbS=st(wb);
  const wo={...base,items:base.items.concat([mkItem(FBY.pain_orge,100)])},woS=st(wo);
  const rows=[
    ["100 g de pain blanc",wbS.peak-b0.peak,wbS.v4-b0.v4],
    ["100 g de pain d'orge",woS.peak-b0.peak,woS.v4-b0.v4],
    ["Diaformine (repas avec pain blanc)",(()=>{const a=st({...wb,diaf:true}),b=st({...wb,diaf:false});return [a.peak-b.peak,a.v4-b.v4]})()],
    ["Soleus 15 min après",(()=>{const a=st({...wb,act:{type:"soleus",min:15}});return [a.peak-wbS.peak,a.v4-wbS.v4]})()],
    ["Marche 20 min après",(()=>{const a=st({...wb,act:{type:"marche",min:20}});return [a.peak-wbS.peak,a.v4-wbS.v4]})()],
    ["Jeûne de plus de 4 h avant",(()=>{const a=st(wb,1);return [a.peak-wbS.peak,a.v4-wbS.v4]})()],
  ].map(r=>Array.isArray(r[1])?[r[0],r[1][0],r[1][1]]:r);
  return rows;
}
function mealObs(){

}

  h+=`<div class="chw">${chart({x0:0,x1:span,y0,y1,zones:false,yt,yf:v=>String(v),xt:ticks,series:[{type:"line2",pts:[[0,GOAL],[span,GOAL]]},{type:"line",pts},{type:"dots",pts,cls:"d-acc",r:3.5}],label:"Courbe de poids"})}</div><p class="small muted" style="margin:0">Pointillés verts : objectif ${GOAL} kg.</p></div>`;
  h+=`<div class="card"><h2>Pesées</h2><div class="chw"><table><thead><tr><th>Date</th><th class="n">Poids</th><th></th></tr></thead><tbody>${ws.slice().reverse().map(w=>`<tr><td>${dayLabel(w.d)} ${w.d.slice(0,4)}</td><td class="n">${fd(w.kg)} kg</td><td class="n">${confirmDel===w.id?`<button class="ghost danger" type="button" data-delw="${w.id}">Confirmer</button>`:`<button class="ghost" type="button" data-askw="${w.id}">Supprimer</button>`}</td></tr>`).join("")}</tbody></table></div></div>`;
  $("#poids-dyn").innerHTML=h;
}
$("#poids-dyn").addEventListener("click",async e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.askw){confirmDel=b.dataset.askw;renderPoids()}else if(b.dataset.delw){confirmDel=null;await del("weights",b.dataset.delw)}});

/* ---------- Démarrage ---------- */
function renderAll(){
  if(TAB==="jour")renderJour();else if(TAB==="modele")renderModele();else if(TAB==="poids")renderPoids();else if(TAB==="repas"){renderQuick();renderMyFoods();renderForecast()}
}
draft=newDraft();syncForm();$("#qa-t").value=nowISO();
try{const t=localStorage.getItem("cg-tab");if(t&&["jour","repas","modele","poids"].includes(t))TAB=t}catch(e){}
setTab(TAB);
$("#storeState").textContent="";
const src=loadLocal();
$("#storeState").textContent="sur ce téléphone";
changed();
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
if("serviceWorker" in navigator&&location.protocol==="https:"){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
})();
</script>
