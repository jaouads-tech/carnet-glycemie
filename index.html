<div class="wrap">
  <header class="top">
    <div class="brand"><h1>Carnet Glycémie</h1><small id="storeState">chargement…</small></div>
  </header>

  <!-- JOUR -->
  <section id="tab-jour" class="wrap-sec" style="display:grid;gap:14px">
    <div id="jour-hero"></div>
    <form class="card" id="qa" autocomplete="off">
      <div class="row" style="justify-content:space-between"><h2>Nouvelle glycémie</h2></div>
      <div class="row">
        <label class="f grow">Valeur (g/L)<input id="qa-v" inputmode="decimal" placeholder="0,95"></label>
        <label class="f grow">Heure<input id="qa-t" type="datetime-local"></label>
      </div>
      <label class="f">Moment
        <select id="qa-c">
          <option value="jeun">À jeun (réveil)</option>
          <option value="avant">Avant repas</option>
          <option value="apres">Après repas</option>
          <option value="coucher">Avant coucher</option>
          <option value="nuit">Nuit</option>
          <option value="autre">Autre</option>
        </select>
      </label>
      <div class="linkinfo" id="qa-link"></div>
      <button class="primary" type="submit">Enregistrer la mesure</button>
    </form>
    <div id="jour-dyn" style="display:grid;gap:14px"></div>
  </section>

  <!-- REPAS -->
  <section id="tab-repas" hidden style="display:grid;gap:14px">
    <div class="card">
      <div class="row" style="justify-content:space-between"><h2 id="r-title">Nouveau repas</h2><button class="ghost" type="button" id="r-reset">Vider</button></div>
      <div class="seg" id="r-type" role="group" aria-label="Type de repas">
        <button type="button" data-v="pdej">Petit-déj.</button><button type="button" data-v="dej">Déjeuner</button><button type="button" data-v="col">Collation</button><button type="button" data-v="din">Dîner</button>
      </div>
      <div class="row">
        <label class="f grow">Heure du repas<input id="r-ts" type="datetime-local"></label>
        <label class="f grow">Nom (facultatif)<input id="r-label" placeholder="Tajine kefta"></label>
      </div>
    </div>

    <div class="card">
      <div class="row" style="justify-content:space-between"><h2>Ce que je mange</h2></div>
      <div class="seg" id="r-mode" role="group" aria-label="Mode de saisie">
        <button type="button" data-v="liste">Liste d'aliments</button><button type="button" data-v="texte">Texte libre</button>
      </div>
      <div id="m-liste" style="display:grid;gap:8px">
        <input id="r-search" placeholder="Chercher : pain d'orge, kefta, lben…" autocomplete="off">
        <div class="results" id="r-results"></div>
      </div>
      <div id="m-texte" hidden style="display:grid;gap:8px">
        <textarea id="r-text" placeholder="Ex : tajine kefta avec oignon, 150 g pain d'orge, coca zero"></textarea>
        <div class="row">
          <button type="button" id="r-parse">Estimer</button>
          
          <span class="small muted" id="r-ai-st"></span>
        </div>
        <div class="small muted" id="r-miss"></div>
      </div>
      <div class="items" id="r-items"></div>
      <div class="totals" id="r-totals"></div>
    </div>

    <div class="card">
      <h2>Contexte</h2>
      <label class="row" style="gap:10px;font-size:15px"><input type="checkbox" id="r-diaf" style="width:20px;height:20px"> Diaformine prise avec ce repas</label>
      <div class="row">
        <label class="f grow">Activité après le repas
          <select id="r-act"><option value="aucune">Aucune</option><option value="soleus">Soleus</option><option value="marche">Marche</option></select>
        </label>
        <label class="f grow">Durée (min)<input id="r-actmin" inputmode="numeric" placeholder="15"></label>
      </div>
      <label class="f">Glycémie avant le repas (g/L)<input id="r-pre" inputmode="decimal" placeholder="0,90"></label>
      <div class="linkinfo" id="r-prehint"></div>
    </div>

    <div class="card" id="r-forecast"></div>

    <div class="row">
      <button class="primary grow" type="button" id="r-save">Enregistrer le repas</button>
    </div>
  </section>

  <!-- ANALYSE -->
  <section id="tab-modele" hidden style="display:grid;gap:14px"><div id="modele-dyn" style="display:grid;gap:14px"></div></section>

  <!-- POIDS -->
  <section id="tab-poids" hidden style="display:grid;gap:14px">
    <form class="card" id="wf" autocomplete="off">
      <h2>Nouvelle pesée</h2>
      <div class="row">
        <label class="f grow">Poids (kg)<input id="w-kg" inputmode="decimal" placeholder="103,3"></label>
        <label class="f grow">Date<input id="w-d" type="date"></label>
      </div>
      <p class="small muted" style="margin:0">Pesez-vous le matin à jeun, après les toilettes, sur la même balance.</p>
      <button class="primary" type="submit">Enregistrer</button>
    </form>
    <div id="poids-dyn" style="display:grid;gap:14px"></div>
  </section>
</div>

<nav class="tabs" aria-label="Sections"><div>

<script>
(() => {
"use strict";
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const pad=n=>String(n).padStart(2,"0");
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const r1=x=>Math.round(x*10)/10;
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const localISO=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
const nowISO=()=>localISO(new Date());
const T=ts=>new Date(ts).getTime();
const addMin=(ts,m)=>localISO(new Date(T(ts)+m*60000));
const dayOf=ts=>ts.slice(0,10);
const hhmm=ts=>ts.slice(11,16).replace(":","h");
const fv=v=>(Math.round(v*100)/100).toFixed(2).replace(".",",");
const fd=(v,d=1)=>Number(v).toFixed(d).replace(".",",");
const sgn=v=>(v>=0?"+":"−")+fv(Math.abs(v));
function num(s){const v=parseFloat(String(s==null?"":s).trim().replace(",","."));return v}
function gly(s){let v=num(s);if(!isFinite(v)||v<=0)return NaN;if(v>4)v=v/100;return Math.round(v*100)/100}
function dur(min){min=Math.round(min);const h=Math.floor(min/60),m=min%60;return h?`${h}h${m?pad(m):""}`:`${m} min`}
const MOIS=["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
const JOURS=["dim.","lun.","mar.","mer.","jeu.","ven.","sam."];
const dayLabel=d=>{const x=new Date(d+"T12:00");return `${JOURS[x.getDay()]} ${x.getDate()} ${MOIS[x.getMonth()]}`};
const ZL={hypo:"Hypoglycémie",bas:"Bas",ok:"Normal",haut:"Élevé",tres:"Très élevé"};
const zone=v=>v<0.70?"hypo":v<0.80?"bas":v<=1.40?"ok":v<=1.80?"haut":"tres";
const chipV=v=>`<span class="chip z-${zone(v)} num">${fv(v)}</span>`;
const TYPES={pdej:"Petit-déjeuner",dej:"Déjeuner",col:"Collation",din:"Dîner"};
const CTX={jeun:"À jeun",avant:"Avant repas",apres:"Après repas",coucher:"Avant coucher",nuit:"Nuit",autre:"Autre"};
const TARGET={kcal:1550,c:170,p:100,f:55,fi:30};
function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,2600)}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

/* ---------- Aliments ---------- */
const norm=s=>String(s).toLowerCase().replace(/œ/g,"oe").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[’']/g,"'");
const FOODS=JSON.parse($("#foods").textContent).map(a=>({id:a[0],name:a[1],kcal:a[2],c:a[3],p:a[4],f:a[5],fi:a[6],gi:a[7],unit:a[8],ug:a[9],al:a[10]}));
const FBY=Object.fromEntries(FOODS.map(f=>[f.id,f]));
const ALIASES=FOODS.flatMap(f=>f.al.map(a=>({a:norm(a),f}))).sort((x,y)=>y.a.length-x.a.length);
const reEsc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
function mkItem(f,g){return {fid:f.id,name:f.name,g:Math.round(g),gi:f.gi,b:[f.kcal,f.c,f.p,f.f,f.fi]}}
function totals(items){
  const t={kcal:0,c:0,p:0,f:0,fi:0,gls:0,glf:0};
  for(const it of items||[]){const k=(it.g||0)/100;const[kc,c,p,f,fi]=it.b;t.kcal+=kc*k;t.c+=c*k;t.p+=p*k;t.f+=f*k;t.fi+=fi*k;const gl=c*k*(it.gi||0)/100;if((it.gi||0)>=55)t.glf+=gl;else t.gls+=gl}
  return t;
}
const NUMW={un:1,une:1,deux:2,trois:3,quatre:4,cinq:5,six:6,sept:7,huit:8,neuf:9,dix:10,demi:0.5,demie:0.5,moitie:0.5,quart:0.25};
function parseText(txt){
  const segs=norm(txt).split(/,|;|\+|\n|\bet\b|\bavec\b|\bpuis\b/).map(s=>s.trim()).filter(Boolean);
  const items=[],miss=[];
  for(let s of segs){
    let work=" "+s+" ";const found=[];
    for(const x of ALIASES){
      const re=new RegExp("(^|[^a-z0-9])"+reEsc(x.a)+"(s|x)?(?=[^a-z]|$)");
      const m=work.match(re);
      if(m){if(!found.some(o=>o.f.id===x.f.id))found.push({f:x.f,pos:m.index});work=work.replace(re,m[1]+" ".repeat(m[0].length-m[1].length))}
    }
    if(!found.length){miss.push(s);continue}
    found.sort((a,b)=>a.pos-b.pos);
    let grams=null,q=1;
    const mg=s.match(/(\d+(?:[.,]\d+)?)\s*(g|gr|gramme|grammes|ml)\b/);
    const mf=s.match(/(\d+)\s*\/\s*(\d+)/);
    const mn=s.match(/(\d+(?:[.,]\d+)?)/);
    if(mg)grams=num(mg[1]);
    else if(s.includes("½"))q=0.5;
    else if(mf)q=num(mf[1])/num(mf[2]);
    else if(mn)q=num(mn[1]);
    else{for(const w of Object.keys(NUMW)){if(new RegExp("\\b"+w+"\\b").test(s)){q=NUMW[w];break}}}
    found.forEach((o,i)=>{const g=i===0?(grams!=null?grams:q*o.f.ug):o.f.ug;items.push(mkItem(o.f,g))});
  }
  return {items,miss};
}

/* ---------- Stockage ---------- */
const COLS=["meals","readings","weights"];
const ST={meals:new Map(),readings:new Map(),weights:new Map()};
let DB=null,ver=0,modelCache=null;const LS="carnet-glycemie";
function fromObj(o){for(const c of COLS)ST[c]=new Map((o[c]||[]).filter(d=>d&&d.id).map(d=>[d.id,d]))}
function loadLocal(){let raw=null;try{raw=localStorage.getItem(LS)}catch(e){}if(raw){try{fromObj(JSON.parse(raw));return "local"}catch(e){}}return "empty"}
function snapshot(){const o={app:"carnet-glycemie",version:1,exportedAt:nowISO()};for(const c of COLS)o[c]=[...ST[c].values()];return o}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(snapshot()))}catch(e){toast("Enregistrement impossible : stockage du navigateur plein ou bloqué.")}}
async function put(c,obj){
  const id=obj.id||(c[0]+"-"+uid());const data={...obj};delete data.id;
  ST[c].set(id,{id,...data});changed();
  if(DB){try{await DB.collection(c).doc(id).set(data)}catch(e){toast(e&&e.code==="quota_exceeded"?"Base pleine : supprimez d'anciennes entrées.":"Enregistrement impossible, réessayez.")}}else saveLocal();
  return id;
}
async function del(c,id){ST[c].delete(id);changed();if(DB){try{await DB.collection(c).doc(id).delete()}catch(e){toast("Suppression impossible, réessayez.")}}else saveLocal()}
const meals=()=>[...ST.meals.values()].filter(m=>m.ts).sort((a,b)=>T(a.ts)-T(b.ts));
const readings=()=>[...ST.readings.values()].filter(r=>r.ts&&isFinite(r.v)).sort((a,b)=>T(a.ts)-T(b.ts));
const weights=()=>[...ST.weights.values()].filter(w=>w.d&&isFinite(w.kg)).sort((a,b)=>a.d<b.d?-1:1);
let rq=0;function changed(){ver++;modelCache=null;if(!rq){rq=requestAnimationFrame(()=>{rq=0;renderAll()})}}

/* ---------- Modèle ---------- */
// Δ(t) = (α·x)·f(t) − (β·x)·g(t), f = montée-descente, g = creux tardif ; x = [1, charge glyc. lente, rapide (saturées), lipides/20, protéines/20, fibres/5, Diaformine, activité/10 min, jeûne>4h, Diamicron]
const FN=["base","GL lente","GL rapide","lipides","protéines","fibres","Diaformine","activité","jeûne >4 h","Diamicron"];
const PA=[0.10,0.06,0.08,-0.015,-0.01,-0.01,-0.06,-0.04,0,-0.05];
const PB=[0.0,0.01,0.05,-0.01,0,-0.01,0.03,0.01,0.08,0.15];
const LAMBDA=5;
function gapBefore(ts,excludeId){let best=null;for(const m of meals()){if(m.id===excludeId)continue;const d=T(ts)-T(m.ts);if(d>0&&(best===null||d<best))best=d}return best===null?99:best/3600000}
function actMin(a){if(!a||a.type==="aucune")return 0;const m=num(a.min)||0;return a.type==="marche"?m*1.3:m}
function feats(meal,fastOverride){
  const t=totals(meal.items);
  const fast=fastOverride!=null?fastOverride:(gapBefore(meal.ts,meal.id)>=4?1:0);
  const sat=gl=>gl/(1+gl/60)/10;
  return {x:[1,sat(t.gls),sat(t.glf),t.f/20,t.p/20,t.fi/5,meal.diaf?1:0,actMin(meal.act)/10,fast,meal.sulfo?1:0],tp:clamp(55+1.6*t.f,55,180),t};
}
function basis(m,tp){const f=(m/tp)*Math.exp(1-m/tp);const c=tp+150,g=Math.exp(-(((m-c)/75)**2));return [f,g]}
function preFor(meal){
  const tm=T(meal.ts);let best=null;
  for(const r of readings()){
    if(r.mealId===meal.id&&r.rel==="pre")return r;
    const d=tm-T(r.ts);
    if(d>=-5*60000&&d<=180*60000){if(r.mealId===meal.id&&r.rel==="post")continue;if(!best||T(r.ts)>T(best.ts))best=r}
  }
  return best;
}
function postsFor(meal){return readings().filter(r=>r.mealId===meal.id&&r.rel==="post").map(r=>({r,m:(T(r.ts)-T(meal.ts))/60000}))}
function solve(A,b){const n=b.length;const M=A.map((row,i)=>[...row,b[i]]);for(let c=0;c<n;c++){let p=c;for(let r=c+1;r<n;r++)if(Math.abs(M[r][c])>Math.abs(M[p][c]))p=r;[M[c],M[p]]=[M[p],M[c]];const v=M[c][c]||1e-9;for(let r=0;r<n;r++){if(r===c)continue;const k=M[r][c]/v;for(let j=c;j<=n;j++)M[r][j]-=k*M[c][j]}}return M.map((row,i)=>row[n]/(row[i]||1e-9))}
function model(){
  if(modelCache)return modelCache;
  const th0=PA.concat(PB),P=th0.length,obs=[],used=new Set();
  for(const meal of meals()){
    const pre=preFor(meal);if(!pre)continue;
    const F=feats(meal);
    for(const {r,m} of postsFor(meal)){
      if(m<30||m>360)continue;
      const [bf,bg]=basis(m,F.tp);
      obs.push({phi:F.x.map(v=>v*bf).concat(F.x.map(v=>-v*bg)),y:r.v-pre.v,meal,m,r});used.add(meal.id);
    }
  }
  const A=Array.from({length:P},(_,i)=>Array.from({length:P},(_,j)=>i===j?LAMBDA:0));
  const b=th0.map(v=>v*LAMBDA);
  for(const o of obs){for(let i=0;i<P;i++){b[i]+=o.phi[i]*o.y;for(let j=0;j<P;j++)A[i][j]+=o.phi[i]*o.phi[j]}}
  const th=solve(A,b);
  let ss=0;for(const o of obs){const p=o.phi.reduce((s,v,i)=>s+v*th[i],0);ss+=(o.y-p)**2}
  const rmse=obs.length?Math.sqrt(ss/obs.length):null;
  const sigma=Math.max(0.10,obs.length>=8?rmse*1.25:0.18);
  modelCache={th,n:obs.length,meals:used.size,rmse,sigma,obs};return modelCache;
}
function curve(meal,pre,fastOverride){
  const M=model(),F=feats(meal,fastOverride),N=F.x.length;
  const a=Math.max(0.02,F.x.reduce((s,v,i)=>s+v*M.th[i],0)),bb=clamp(F.x.reduce((s,v,i)=>s+v*M.th[N+i],0),-0.1,0.9);
  const pts=[];for(let m=0;m<=360;m+=10){const [f,g]=basis(m,F.tp);pts.push([m,Math.max(0.3,pre+a*f-bb*g)])}
  return pts;
}
function curveStats(pts){
  let pk=pts[0],nd=null;for(const p of pts){if(p[1]>pk[1])pk=p;if(p[0]>=90&&(!nd||p[1]<nd[1]))nd=p}
  const at=m=>pts.find(p=>p[0]===m)[1];
  return {peak:pk[1],peakM:pk[0],nadir:nd[1],nadirM:nd[0],v2:at(120),v4:at(240)};
}

/* ---------- Graphique ---------- */
function chart(o){
  const w=o.w||340,h=o.h||190,L=32,R=8,Tp=8,B=20,W=w-L-R,H=h-Tp-B;
  const X=x=>L+(x-o.x0)/(o.x1-o.x0)*W,Y=y=>Tp+(1-(clamp(y,o.y0,o.y1)-o.y0)/(o.y1-o.y0))*H;
  let s=`<svg viewBox="0 0 ${w} ${h}" class="ch" role="img" aria-label="${esc(o.label||"Graphique")}">`;
  if(o.zones){
    s+=`<rect class="zb-ok" x="${L}" y="${Y(1.40)}" width="${W}" height="${Y(0.70)-Y(1.40)}"/>`;
    s+=`<rect class="zb-hypo" x="${L}" y="${Y(0.70)}" width="${W}" height="${Y(o.y0)-Y(0.70)}"/>`;
    if(o.y1>1.80)s+=`<rect class="zb-high" x="${L}" y="${Y(o.y1)}" width="${W}" height="${Y(1.80)-Y(o.y1)}"/>`;
    s+=`<line class="thr thr-hypo" x1="${L}" x2="${L+W}" y1="${Y(0.70)}" y2="${Y(0.70)}"/><line class="thr thr-high" x1="${L}" x2="${L+W}" y1="${Y(1.40)}" y2="${Y(1.40)}"/>`;
  }
  for(const t of o.yt){s+=`<line class="grid" x1="${L}" x2="${L+W}" y1="${Y(t)}" y2="${Y(t)}" opacity=".5"/><text x="${L-5}" y="${Y(t)+3}" text-anchor="end">${o.yf?o.yf(t):fd(t,1)}</text>`}
  for(const t of o.xt){s+=`<text x="${X(t.v)}" y="${h-5}" text-anchor="middle">${esc(t.l)}</text>`}
  for(const se of o.series){
    if(!se.pts.length)continue;
    if(se.type==="band"){const up=se.pts.map(p=>`${X(p[0])},${Y(p[2])}`),lo=se.pts.slice().reverse().map(p=>`${X(p[0])},${Y(p[1])}`);s+=`<polygon class="band" points="${up.concat(lo).join(" ")}"/>`}
    else if(se.type==="line"||se.type==="line2"){s+=`<path class="${se.type==="line"?"ln":"ln2"}" d="${se.pts.map((p,i)=>(i?"L":"M")+X(p[0]).toFixed(1)+" "+Y(p[1]).toFixed(1)).join(" ")}"/>`}
    else if(se.type==="dots"){for(const p of se.pts)s+=`<circle class="dot ${se.cls?se.cls:"d-"+zone(p[1])}" cx="${X(p[0]).toFixed(1)}" cy="${Y(p[1]).toFixed(1)}" r="${se.r||4}"/>`}
  }
  return s+"</svg>";
}

/* ---------- Onglets ---------- */
let TAB="jour";
function setTab(t){TAB=t;for(const k of ["jour","repas","modele","poids"])$("#tab-"+k).hidden=k!==t;$$(".tabs button").forEach(b=>b.setAttribute("aria-current",b.dataset.tab===t?"page":"false"));try{localStorage.setItem("cg-tab",t)}catch(e){}renderAll();window.scrollTo(0,0)}
$$(".tabs button").forEach(b=>b.addEventListener("click",()=>setTab(b.dataset.tab)));

/* ---------- JOUR ---------- */
let curDay=dayOf(nowISO()),confirmDel=null;
function lastMealBefore(ts,maxH){let best=null;for(const m of meals()){const d=T(ts)-T(m.ts);if(d>=0&&d<=maxH*3600000)best=m}return best}
const mealName=m=>m.label||(m.items||[]).slice(0,3).map(i=>i.name.split(" (")[0]).join(", ")||TYPES[m.type]||"Repas";
function qaLink(){
  const c=$("#qa-c").value,ts=$("#qa-t").value||nowISO();
  if(c!=="apres"){$("#qa-link").textContent="";return null}
  const m=lastMealBefore(ts,7);
  $("#qa-link").textContent=m?`Liée à : ${TYPES[m.type]||"repas"} « ${mealName(m)} » de ${hhmm(m.ts)} (+${dur((T(ts)-T(m.ts))/60000)}).`:"Aucun repas dans les 7 dernières heures : enregistrez d'abord le repas pour que la mesure serve à la prévision.";
  return m;
}
$("#qa-c").addEventListener("change",qaLink);$("#qa-t").addEventListener("change",qaLink);
$("#qa").addEventListener("submit",async e=>{
  e.preventDefault();const v=gly($("#qa-v").value);if(!isFinite(v)){toast("Entrez une valeur, par ex. 0,95");return}
  const ts=$("#qa-t").value||nowISO(),c=$("#qa-c").value;const doc={ts,v,ctx:c};
  if(c==="apres"){const m=qaLink();if(m){doc.mealId=m.id;doc.rel="post"}}
  await put("readings",doc);$("#qa-v").value="";$("#qa-t").value=nowISO();
  curDay=dayOf(ts);toast(v<0.70?"Enregistré. Sous 0,70 : resucrez maintenant (3 dattes ou 1 verre de jus).":"Mesure enregistrée");
});
function hoursSinceLastIntake(){const ms=meals();if(!ms.length)return null;const last=ms[ms.length-1];return (Date.now()-T(last.ts))/3600000}
function renderJour(){
  const rs=readings(),ms=meals();const last=rs[rs.length-1];
  let h="";
  if(last){
    const z=zone(last.v);const ago=(Date.now()-T(last.ts))/60000;
    h+=`<div class="card"><div class="hero"><div><div class="eyebrow">Dernière glycémie · ${dayLabel(dayOf(last.ts))} ${hhmm(last.ts)}</div><div class="big z-${z}">${fv(last.v)}<small>g/L</small></div></div><span class="chip z-${z}">${ZL[z]}</span></div>`;
    const gap=hoursSinceLastIntake();
    if(last.v<0.70&&ago<60)h+=`<div class="notice alert"><b>Hypoglycémie</b>Prenez 15 g de sucre rapide (3 dattes, 1 verre de jus), remesurez dans 15 min, puis mangez une collation avec pain d'orge ou complet.</div>`;

function preHint(){

function renderForecast(){

  if(!draft.items.length){box.innerHTML=`<h2>Prévision</h2><p class="empty">Ajoutez le repas pour voir la courbe prévue, le pic, le risque de baisse et l'activité conseillée.</p>`;return}
  let pre=gly(draft.pre),assumed=false;if(!isFinite(pre)){pre=hint?hint.v:1.0;assumed=true}
  const M=model();const fast=gapBefore(draft.ts,draft.id)>=4?1:0;
  const mk=act=>({...draft,act});
  const cur=curve(mk(draft.act),pre,fast),st=curveStats(cur);
  const scen=[{k:"Sans activité",a:{type:"aucune",min:0}},{k:"Soleus 10 min",a:{type:"soleus",min:10}},{k:"Soleus 20 min",a:{type:"soleus",min:20}},{k:"Marche 20 min",a:{type:"marche",min:20}}].map(s=>({...s,st:curveStats(curve(mk(s.a),pre,fast))}));
  const at=m=>addMin(draft.ts,m).slice(11,16).replace(":","h");
  const adv=[];
  if(pre<0.70)adv.push(["alert","Glycémie sous 0,70 avant le repas","Resucrez d'abord (3 dattes ou 1 verre de jus), remesurez 15 min après, puis mangez."]);
  const bestPk=scen.slice().sort((a,b)=>a.st.peak-b.st.peak)[0];
  if(st.peak>=1.60){
    const s=scen.find(x=>x.k==="Soleus 20 min");
    adv.push(["alert",`Pic prévu vers ${fv(st.peak)} à ${at(st.peakM)} (+${dur(st.peakM)})`,`Faites 20 min de soleus dans les 15 min après le repas : pic ramené vers ${fv(s.st.peak)}. Une marche de 20 min donne ${fv(scen[3].st.peak)}.`+(totals(draft.items).glf>=20?" Remplacer le pain blanc par du pain d'orge réduirait aussi ce pic.":"")]);
  }else if(st.peak>=1.40){
    const s=scen.find(x=>x.k==="Soleus 10 min");
    adv.push(["warn",`Pic modéré vers ${fv(st.peak)} à ${at(st.peakM)}`,`10 à 15 min de soleus juste après le repas suffisent (≈ ${fv(s.st.peak)}).`]);
  }else adv.push(["ok",`Pic contenu : ${fv(st.peak)} à ${at(st.peakM)}`,"Pas d'activité nécessaire pour ce repas."]);
  if(st.nadir<0.70)adv.push(["alert",`Risque d'hypoglycémie vers ${at(st.nadirM)} (≈ ${fv(st.nadir)})`,`Prévoyez une collation protéine + glucide lent vers ${at(Math.max(90,st.nadirM-40))} (lben + pain d'orge, yaourt + fruit) et mesurez à ce moment. Gardez du sucre rapide sur vous.`]);
  else if(st.nadir<0.80)adv.push(["warn",`Baisse vers ${fv(st.nadir)} à ${at(st.nadirM)}`,`Une petite collation vers ${at(Math.max(90,st.nadirM-30))} évite de descendre sous 0,80.`]);
  if(actMin(draft.act)){const none=scen[0].st;if(st.nadir<0.85&&st.nadir<none.nadir-0.02)adv.push(["warn","L'activité accentue la baisse tardive",`Sans activité le point bas serait ${fv(none.nadir)}. Gardez une collation à portée.`])}

  if(!draft.diaf&&(draft.type==="dej"||draft.type==="din"))adv.push(["info","Diaformine non cochée","Si elle est prévue avec ce repas, cochez-la : la prévision en tient compte."]);

  h+=`<div class="chw">${chart({x0:0,x1:360,y0:ymin,y1:ymax,zones:true,yt:[0.5,0.7,1.0,1.4,1.8,2.2].filter(v=>v>=ymin&&v<=ymax),xt:[0,60,120,180,240,300,360].map(v=>({v,l:v?"+"+v/60+"h":at(0)})),series,label:"Courbe de glycémie prévue"})}</div>`;
  h+=`<p class="small muted" style="margin:0">Départ ${fv(pre)}${assumed?" (supposé : mesurez avant de manger)":""}. Bande bleue : marge d'erreur actuelle ±${fv(M.sigma)}.${alt?" Pointillés verts : avec 20 min de soleus.":""}</p>`;
  h+=`<div class="adv">${adv.map(a=>`<div class="notice ${a[0]}"><b>${esc(a[1])}</b>${esc(a[2])}</div>`).join("")}</div>`;
  h+=`<div class="chw"><table><thead><tr><th>Scénario</th><th class="n">Pic</th><th class="n">Point bas</th><th class="n">+4 h</th></tr></thead><tbody>${scen.map(s=>`<tr><td>${s.k}</td><td class="n z-${zone(s.st.peak)}">${fv(s.st.peak)}</td><td class="n z-${zone(s.st.nadir)}">${fv(s.st.nadir)}</td><td class="n">${fv(s.st.v4)}</td></tr>`).join("")}</tbody></table></div>`;

  h+=`<p class="disc" style="margin:0">Prévision statistique apprise sur ${M.n} mesure(s) de ${M.meals} repas. Elle ne remplace ni une mesure ni l'avis de votre endocrinologue, et ne sert jamais à modifier une dose de médicament.</p>`;

/* ---------- ANALYSE ---------- */
function effectRows(){
  const base={ts:"2026-01-01T13:00",items:[mkItem(FBY.poulet,150),mkItem(FBY.salade,200)],diaf:true,act:{type:"aucune",min:0}};
  const st=(m,f=0)=>curveStats(curve(m,0.95,f));
  const b0=st(base);
  const wb={...base,items:base.items.concat([mkItem(FBY.pain_blanc,100)])},wbS=st(wb);
  const wo={...base,items:base.items.concat([mkItem(FBY.pain_orge,100)])},woS=st(wo);
  const rows=[
    ["100 g de pain blanc",wbS.peak-b0.peak,wbS.v4-b0.v4],
    ["100 g de pain d'orge",woS.peak-b0.peak,woS.v4-b0.v4],
    ["Diaformine (repas avec pain blanc)",(()=>{const a=st({...wb,diaf:true}),b=st({...wb,diaf:false});return [a.peak-b.peak,a.v4-b.v4]})()],
    ["Soleus 15 min après",(()=>{const a=st({...wb,act:{type:"soleus",min:15}});return [a.peak-wbS.peak,a.v4-wbS.v4]})()],
    ["Marche 20 min après",(()=>{const a=st({...wb,act:{type:"marche",min:20}});return [a.peak-wbS.peak,a.v4-wbS.v4]})()],
    ["Jeûne de plus de 4 h avant",(()=>{const a=st(wb,1);return [a.peak-wbS.peak,a.v4-wbS.v4]})()],
  ].map(r=>Array.isArray(r[1])?[r[0],r[1][0],r[1][1]]:r);
  return rows;
}
function mealObs(){
  const out=[];for(const m of meals()){const pre=preFor(m);const ps=postsFor(m).filter(p=>p.m>=30&&p.m<=420);if(!pre||!ps.length)continue;
    const mx=Math.max(...ps.map(p=>p.r.v)),mn=Math.min(...ps.map(p=>p.r.v));out.push({m,pre:pre.v,mx,mn,rise:mx-pre.v})}
  return out;
}
function saveFile(name,data,type){try{const url=URL.createObjectURL(new Blob([data],{type}));const a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);return true}catch(e){toast("Téléchargement impossible sur ce navigateur");return false}}
function backup(){if(saveFile(`sauvegarde-carnet-${dayOf(nowISO())}.json`,JSON.stringify(snapshot()),"application/json")){try{localStorage.setItem("cg-lastbackup",nowISO())}catch(e){}toast("Sauvegarde téléchargée. Gardez-la dans Google Drive ou WhatsApp.");renderAll()}}
let pendingRestore=null;
function readRestore(file){const fr=new FileReader();fr.onload=()=>{try{const o=JSON.parse(fr.result);if(!o||!Array.isArray(o.meals)||!Array.isArray(o.readings))throw 0;const empty=!ST.meals.size&&!ST.readings.size&&!ST.weights.size;if(empty){fromObj(o);saveLocal();changed();toast(`Historique restauré : ${o.meals.length} repas, ${o.readings.length} glycémies`)}else{pendingRestore=o;renderModele()}}catch(e){toast("Ce fichier n'est pas une sauvegarde du Carnet.")}};fr.readAsText(file)}
function lastBackup(){try{return localStorage.getItem("cg-lastbackup")}catch(e){return null}}
async function exportCSV(){
  const lines=["type;date;heure;valeur_gL;contexte;repas;kcal;glucides_g;proteines_g;lipides_g;fibres_g;charge_glycemique;diaformine;activite"];
  for(const r of readings()){const m=r.mealId?ST.meals.get(r.mealId):null;lines.push(["glycemie",dayOf(r.ts),r.ts.slice(11,16),fd(r.v,2),CTX[r.ctx]||"",m?mealName(m).replace(/;/g,","):"","","","","","","","",""].join(";"))}
  for(const m of meals()){const t=totals(m.items);lines.push(["repas",dayOf(m.ts),m.ts.slice(11,16),"",TYPES[m.type]||"",mealName(m).replace(/;/g,","),Math.round(t.kcal),Math.round(t.c),Math.round(t.p),Math.round(t.f),Math.round(t.fi),Math.round(t.gls+t.glf),m.diaf?"oui":"non",actMin(m.act)?`${m.act.type} ${m.act.min} min`:""].join(";"))}
  for(const w of weights())lines.push(["poids",w.d,"",fd(w.kg,1),"","","","","","","","","",""].join(";"));
  saveFile(`carnet-glycemie-${dayOf(nowISO())}.csv`,"\ufeff"+lines.join("\n"),"text/csv;charset=utf-8")
}
function renderModele(){
  const M=model(),rs=readings();
  const rel=M.n>=40?["Bonne","ok"]:M.n>=15?["Moyenne","bas"]:["Faible","haut"];
  let h=`<div class="card"><div class="row" style="justify-content:space-between"><h2>Ce que le modèle a appris</h2><span class="chip z-${rel[1]}">Fiabilité ${rel[0].toLowerCase()}</span></div>`;
  h+=`<div class="stats"><div class="stat"><span class="v">${M.n}</span><span class="k">mesures après repas utilisées</span></div><div class="stat"><span class="v">${M.meals}</span><span class="k">repas analysés</span></div><div class="stat"><span class="v">±${fv(M.sigma)}</span><span class="k">marge d'erreur (g/L)</span></div></div>`;
  h+=`<p class="small muted" style="margin:0">Le modèle part de valeurs moyennes et s'ajuste à vos mesures. Il lui faut, pour chaque repas, la glycémie avant puis à +2 h et +4 h. Au-delà de 40 mesures, la fiabilité devient bonne.</p>`;
  h+=`<div class="chw"><table><thead><tr><th>Effet sur votre glycémie</th><th class="n">Sur le pic</th><th class="n">À +4 h</th></tr></thead><tbody>${effectRows().map(r=>`<tr><td>${r[0]}</td><td class="n">${sgn(r[1])}</td><td class="n">${sgn(r[2])}</td></tr>`).join("")}</tbody></table></div>`;
  h+=`<p class="disc" style="margin:0">Calculé sur un repas de référence (poulet + salade, départ 0,95 g/L). Un pic plus bas et un +4 h moins négatif sont meilleurs.</p></div>`;
  const ob=mealObs();
  if(ob.length){
    const score=o=>Math.max(0,o.mx-1.40)*2+Math.max(0,0.80-o.mn)*3+Math.max(0,o.rise-0.4);
    const sorted=ob.slice().sort((a,b)=>score(a)-score(b));
    const row=o=>`<tr><td>${esc(mealName(o.m))}<br><span class="small muted">${dayLabel(dayOf(o.m.ts))} ${hhmm(o.m.ts)}</span></td><td class="n">${fv(o.pre)}</td><td class="n z-${zone(o.mx)}">${fv(o.mx)}</td><td class="n z-${zone(o.mn)}">${fv(o.mn)}</td></tr>`;
    const head=`<thead><tr><th>Repas</th><th class="n">Avant</th><th class="n">Max</th><th class="n">Min</th></tr></thead>`;
    h+=`<div class="card"><h2>Vos repas les plus stables</h2><div class="chw"><table>${head}<tbody>${sorted.slice(0,5).map(row).join("")}</tbody></table></div></div>`;
    const bad=sorted.slice().reverse().filter(o=>score(o)>0).slice(0,5);
    if(bad.length)h+=`<div class="card"><h2>Repas à surveiller</h2><p class="small muted" style="margin:0">Pic au-dessus de 1,40 ou descente sous 0,80 après le repas.</p><div class="chw"><table>${head}<tbody>${bad.map(row).join("")}</tbody></table></div></div>`;
  }
  const since=Date.now()-30*86400000;const r30=rs.filter(r=>T(r.ts)>=since);const pool=r30.length>=5?r30:rs;const lbl=r30.length>=5?"30 derniers jours":"Toutes les mesures";
  if(pool.length){
    const inr=pool.filter(r=>r.v>=0.70&&r.v<=1.40).length,hy=pool.filter(r=>r.v<0.70).length,j=pool.filter(r=>r.ctx==="jeun");
    const t0=T(pool[0].ts),t1=Math.max(T(pool[pool.length-1].ts),t0+86400000);
    const pts=pool.map(r=>[(T(r.ts)-t0)/86400000,r.v]);const span=(t1-t0)/86400000;
    const ymax=Math.max(1.8,...pool.map(r=>r.v+0.1));
    const ticks=[0,0.5,1].map(f=>{const tt=t0+f*(t1-t0);const dd=new Date(tt);return {v:f*span,l:`${dd.getDate()} ${MOIS[dd.getMonth()]}`}});
    h+=`<div class="card"><h2>${lbl}</h2><div class="stats"><div class="stat"><span class="v">${pool.length}</span><span class="k">mesures</span></div><div class="stat"><span class="v">${Math.round(inr/pool.length*100)} %</span><span class="k">entre 0,70 et 1,40</span></div><div class="stat"><span class="v ${hy?"z-hypo":""}">${hy}</span><span class="k">hypoglycémies (&lt; 0,70)</span></div><div class="stat"><span class="v">${j.length?fv(j.reduce((s,r)=>s+r.v,0)/j.length):"–"}</span><span class="k">moyenne à jeun</span></div></div>`;
    h+=`<div class="chw">${chart({x0:0,x1:span,y0:0.4,y1:ymax,zones:true,yt:[0.5,1.0,1.5,2.0].filter(v=>v<=ymax),xt:ticks,series:[{type:"dots",pts,r:3.2}],label:"Glycémies"})}</div></div>`;
  }
  h+=`<div class="card"><h2>Pour votre endocrinologue</h2><p class="small muted" style="margin:0">Exportez toutes vos mesures, repas et pesées en tableau (CSV), à ouvrir dans Excel ou à envoyer par WhatsApp.</p><button type="button" id="exp">Exporter le tableau (CSV)</button></div>`;
  const lb=lastBackup();
  h+=`<div class="card"><h2>Sauvegarde</h2><p class="small muted" style="margin:0">Vos données sont gardées seulement dans ce téléphone. Si vous videz les données de Chrome ou changez de téléphone, elles sont perdues. Téléchargez une sauvegarde chaque semaine et gardez-la dans Google Drive.</p><p class="small" style="margin:0">Dernière sauvegarde : <b class="num">${lb?dayLabel(dayOf(lb))+" "+hhmm(lb):"jamais"}</b></p><div class="row"><button type="button" class="primary" id="bk">Télécharger une sauvegarde</button><label class="f" style="font-size:14px"><span class="small muted">Restaurer depuis un fichier</span><input type="file" id="rs" accept=".json,application/json"></label></div>${pendingRestore?`<div class="notice warn"><b>Remplacer les données actuelles ?</b>Le fichier contient ${pendingRestore.meals.length} repas, ${pendingRestore.readings.length} glycémies et ${(pendingRestore.weights||[]).length} pesées. Les données de ce téléphone seront remplacées.<div class="row" style="margin-top:6px"><button type="button" class="primary" id="rs-ok">Remplacer</button><button type="button" id="rs-no">Annuler</button></div></div>`:""}</div>`;
  $("#modele-dyn").innerHTML=h;$("#exp").onclick=exportCSV;$("#bk").onclick=backup;$("#rs").onchange=e=>{const f=e.target.files&&e.target.files[0];if(f)readRestore(f)};
  if(pendingRestore){$("#rs-ok").onclick=()=>{fromObj(pendingRestore);pendingRestore=null;saveLocal();changed();toast("Données restaurées")};$("#rs-no").onclick=()=>{pendingRestore=null;renderModele()}}
}

/* ---------- POIDS ---------- */
$("#w-d").value=dayOf(nowISO());
$("#wf").addEventListener("submit",async e=>{e.preventDefault();const kg=num($("#w-kg").value);if(!isFinite(kg)||kg<30||kg>300){toast("Entrez un poids, par ex. 103,3");return}const d=$("#w-d").value||dayOf(nowISO());const ex=weights().find(w=>w.d===d);await put("weights",{id:ex?ex.id:"w-"+d,d,kg:Math.round(kg*10)/10});$("#w-kg").value="";toast("Pesée enregistrée")});
function renderPoids(){
  const ws=weights();const GOAL=90;
  if(!ws.length){$("#poids-dyn").innerHTML=`<div class="card"><p class="empty">Aucune pesée. Ajoutez votre poids du matin pour suivre la courbe vers ${GOAL} kg.</p></div>`;return}
  const first=ws[0],last=ws[ws.length-1];
  const recent=ws.filter(w=>T(w.d)>=T(last.d)-45*86400000);let rate=null;
  if(recent.length>=2){const a=recent[0],b=recent[recent.length-1];const days=(T(b.d)-T(a.d))/86400000;if(days>=7)rate=(b.kg-a.kg)/days*7}
  if(rate==null&&ws.length>=2){const days=(T(last.d)-T(first.d))/86400000;if(days>0)rate=(last.kg-first.kg)/days*7}
  let eta="–";if(rate&&rate<0&&last.kg>GOAL){const wk=(last.kg-GOAL)/-rate;const dd=new Date(T(last.d)+wk*7*86400000);eta=`${MOIS[dd.getMonth()]} ${dd.getFullYear()}`}
  const t0=T(first.d),t1=Math.max(T(last.d),t0+86400000);const span=(t1-t0)/86400000;
  const pts=ws.map(w=>[(T(w.d)-t0)/86400000,w.kg]);
  const y0=Math.floor(Math.min(GOAL,...ws.map(w=>w.kg))-2),y1=Math.ceil(Math.max(...ws.map(w=>w.kg))+2);
  const ticks=[0,0.5,1].map(f=>{const dd=new Date(t0+f*(t1-t0));return {v:f*span,l:`${dd.getDate()} ${MOIS[dd.getMonth()]}`}});
  const yt=[];for(let v=Math.ceil(y0/5)*5;v<=y1;v+=5)yt.push(v);
  let h=`<div class="card"><div class="stats"><div class="stat"><span class="v">${fd(last.kg)}</span><span class="k">kg le ${dayLabel(last.d)}</span></div><div class="stat"><span class="v z-ok">${(last.kg-first.kg>=0?"+":"−")+fd(Math.abs(last.kg-first.kg))}</span><span class="k">kg depuis le ${dayLabel(first.d)}</span></div><div class="stat"><span class="v">${rate!=null?fd(rate,2):"–"}</span><span class="k">kg par semaine (récent)</span></div><div class="stat"><span class="v">${fd(Math.max(0,last.kg-GOAL))}</span><span class="k">kg jusqu'à ${GOAL} kg · ${eta}</span></div></div>`;
  h+=`<div class="chw">${chart({x0:0,x1:span,y0,y1,zones:false,yt,yf:v=>String(v),xt:ticks,series:[{type:"line2",pts:[[0,GOAL],[span,GOAL]]},{type:"line",pts},{type:"dots",pts,cls:"d-acc",r:3.5}],label:"Courbe de poids"})}</div><p class="small muted" style="margin:0">Pointillés verts : objectif ${GOAL} kg.</p></div>`;
  h+=`<div class="card"><h2>Pesées</h2><div class="chw"><table><thead><tr><th>Date</th><th class="n">Poids</th><th></th></tr></thead><tbody>${ws.slice().reverse().map(w=>`<tr><td>${dayLabel(w.d)} ${w.d.slice(0,4)}</td><td class="n">${fd(w.kg)} kg</td><td class="n">${confirmDel===w.id?`<button class="ghost danger" type="button" data-delw="${w.id}">Confirmer</button>`:`<button class="ghost" type="button" data-askw="${w.id}">Supprimer</button>`}</td></tr>`).join("")}</tbody></table></div></div>`;
  $("#poids-dyn").innerHTML=h;
}
$("#poids-dyn").addEventListener("click",async e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.askw){confirmDel=b.dataset.askw;renderPoids()}else if(b.dataset.delw){confirmDel=null;await del("weights",b.dataset.delw)}});

/* ---------- Démarrage ---------- */
function renderAll(){
  if(TAB==="jour")renderJour();else if(TAB==="modele")renderModele();else if(TAB==="poids")renderPoids();else if(TAB==="repas")renderForecast();
}
draft=newDraft();syncForm();$("#qa-t").value=nowISO();
try{const t=localStorage.getItem("cg-tab");if(t&&["jour","repas","modele","poids"].includes(t))TAB=t}catch(e){}
setTab(TAB);
$("#storeState").textContent="";
const src=loadLocal();
$("#storeState").textContent="sur ce téléphone";
changed();
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
if("serviceWorker" in navigator&&location.protocol==="https:"){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
})();
</script>
